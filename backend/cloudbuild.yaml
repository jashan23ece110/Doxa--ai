steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/doxa-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/doxa-backend:latest',
      '.'
    ]

  # Step 2: Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/doxa-backend:$COMMIT_SHA']

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/doxa-backend:latest']

  # Step 4: Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'doxa-backend',
      '--image', 'gcr.io/$PROJECT_ID/doxa-backend:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--no-cpu-throttling',
      '--min-instances', '0',
      '--max-instances', '10'
    ]

images:
  - 'gcr.io/$PROJECT_ID/doxa-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/doxa-backend:latest'
